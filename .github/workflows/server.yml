name: Deploy API

# Manual only: the CI IAM user is scoped to S3 + CloudFront and cannot create
# CloudFormation change sets. API deploys are run by hand with an admin profile
# (sam deploy, stack gitlang-api, us-east-2). Do not re-add a push trigger
# unless the CI user is granted a scoped deploy role.
on:
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm i

      - name: Bundle Lambda
        run: npm run build:lambda

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy with SAM
        env:
          ORIGIN_VERIFY_SECRET: ${{ secrets.ORIGIN_VERIFY_SECRET }}
        run: |
          # Unset secret => parameter omitted => the stack keeps its previous value.
          overrides=()
          if [ -n "$ORIGIN_VERIFY_SECRET" ]; then
            overrides=(--parameter-overrides "OriginVerifySecret=$ORIGIN_VERIFY_SECRET")
          fi
          sam deploy \
            --template-file infra/template.yaml \
            --stack-name gitlang-api \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            "${overrides[@]}"
